title = "studio-api gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allow obvious documentation placeholders and verified public model IDs only"
paths = [
  '''(^|/).*README\.md$''',
  '''(^|/).*SKILL\.md$'''
]

regexes = [
  '''(?i)change-me''',
  '''(?i)example''',
  '''(?i)secret''',
  '''(?i)<token>''',
  '''(?i)encryptedvaluehere''',
  '''(?i)claude-opus-4\.8''',
  '''(?i)claude-haiku-4\.5''',
  '''(?i)mistral-medium-3\.5'''
]
