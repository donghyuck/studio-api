name: Modular composition
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'starter/**'
      - 'studio-platform*/**'
      - 'studio-application-modules/**'
      - 'verification/**'
      - 'scripts/verify-modular-consumers.sh'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/modular-composition.yml'
permissions:
  contents: read
jobs:
  consumer-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash scripts/verify-modular-consumers.sh
